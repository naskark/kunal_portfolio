version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 requires Node >= 20.9; .nvmrc pins the exact version.
        - nvm install
        - nvm use
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
